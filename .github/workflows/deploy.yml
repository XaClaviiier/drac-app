name: Deploy to DirectAdmin

on:
  push:
    branches:
      - main

# Cegah dua upload FTP menulis versi frontend/API yang berbeda secara bersamaan.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Siapkan PHP untuk validasi API
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          coverage: none

      - run: npm ci

      - name: Periksa sintaks seluruh API PHP
        shell: bash
        run: |
          set -euo pipefail
          find api -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - run: npm run check

      - run: npm run build

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./dist/
          server-dir: /domains/cerdikapp.my.id/public_html/

      - name: Deploy API tanpa menimpa konfigurasi database
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          local-dir: ./api/
          server-dir: /domains/cerdikapp.my.id/public_html/api/
          exclude: |
            **/config.php
            **/README-INSTALL.md
