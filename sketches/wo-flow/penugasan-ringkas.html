<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Penugasan dan estimasi</title><style>*{box-sizing:border-box}body{margin:0;padding:0;background:transparent;color:var(--foreground,#263747);font:14px system-ui,sans-serif}.row{display:flex;align-items:flex-start;gap:16px;width:100%}.tech{flex:1;min-width:0}.estimate{flex:0 0 auto}label{display:block;font-weight:600;margin-bottom:8px}.field{min-height:42px;border:1px solid var(--border,#cbd5df);border-radius:7px;display:flex;align-items:center;background:var(--card,transparent)}.people{padding:6px;gap:6px;flex-wrap:wrap}.chip{padding:4px 8px;border-radius:4px;background:var(--border,#edf1f5)}button{font:inherit;background:transparent;color:var(--accent,#248571);border:0;cursor:pointer;padding:4px}.duration{overflow:hidden}.duration input{width:calc(3ch + 20px);min-width:0;border:0;outline:none;padding:10px;text-align:center;color:inherit;background:transparent;font:inherit}.duration:focus-within{outline:2px solid var(--accent,#248571);outline-offset:2px}.unit{padding:11px 12px;border-left:1px solid var(--border,#cbd5df);background:var(--border,#edf1f5);font-size:13px}.note{font-size:12px;color:var(--muted-foreground,#74818e);margin:12px 0 0}dialog{color:inherit;background:var(--card,#fff);border:1px solid var(--border,#cbd5df);border-radius:8px;padding:18px}dialog input{padding:8px;margin:10px 0}</style><div class="row"><div class="tech"><label>Dikerjakan oleh</label><div class="field people" id="people"><span class="chip">Andi</span><button type="button" onclick="document.getElementById('add').showModal()">+ Tambah</button></div></div><div class="estimate"><label for="hours">Estimasi</label><div class="field duration"><input id="hours" aria-label="Estimasi durasi dalam jam" inputmode="decimal" maxlength="3" value="2"><span class="unit">jam</span></div></div></div><p class="note">Contoh desain · Nama teknisi dan estimasi dalam satu baris.</p><dialog id="add"><form method="dialog" id="form"><label for="name">Nama teknisi contoh</label><input id="name" required maxlength="40"><div><button value="cancel" formnovalidate>Batal</button><button value="add">Tambah</button></div></form></dialog><script>document.getElementById('form').addEventListener('submit',e=>{if(e.submitter.value!=='add')return;const n=document.getElementById('name');if(!n.value.trim()){e.preventDefault();return}const tag=document.createElement('span');tag.className='chip';tag.textContent=n.value.trim();const box=document.getElementById('people');box.insertBefore(tag,box.lastElementChild);n.value=''})</script></html>
