<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teknisi dan estimasi</title><style>*{box-sizing:border-box}body{margin:0;background:transparent;color:var(--foreground,#263747);font:14px system-ui,sans-serif}.row{display:flex;gap:16px;align-items:flex-start}.tech{flex:1;min-width:0}label{display:block;font-weight:600;margin-bottom:8px}.field{min-height:44px;border:1px solid var(--border,#cbd5df);border-radius:7px;display:flex;align-items:center;background:var(--card,transparent)}.people{padding:5px;gap:6px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:7px;padding:3px 5px 3px 9px;border-radius:5px;background:var(--border,#edf1f5)}button{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer;padding:4px 7px;border-radius:4px}button:hover{background:var(--card,#fff)}.remove{font-size:18px;line-height:20px}.add{color:var(--accent,#248571)}.duration{overflow:hidden}.duration input{width:calc(3ch + 20px);border:0;outline:none;padding:12px 10px;text-align:center;color:inherit;background:transparent;font:inherit}.duration:focus-within{outline:2px solid var(--accent,#248571)}.unit{padding:12px;border-left:1px solid var(--border,#cbd5df);background:var(--border,#edf1f5)}p{font-size:12px;color:var(--muted-foreground,#74818e);margin:12px 0 0}dialog{color:inherit;background:var(--card,#fff);border:1px solid var(--border,#cbd5df);border-radius:8px;padding:18px}dialog input{padding:8px;margin:10px 0}</style><div class="row"><div class="tech"><label>Dikerjakan oleh</label><div class="field people" id="people"><span class="chip">Andi<button class="remove" type="button" aria-label="Hapus Andi dari penugasan" onclick="this.parentElement.remove()">×</button></span><button class="add" type="button" onclick="document.getElementById('add').showModal()">+ Tambah</button></div></div><div><label for="hours">Estimasi</label><div class="field duration"><input id="hours" aria-label="Estimasi dalam jam" inputmode="decimal" maxlength="3" value="2"><span class="unit">jam</span></div></div></div><p>Contoh desain · Klik × untuk mengeluarkan teknisi dari penugasan ini.</p><dialog id="add"><form method="dialog" id="form"><label for="name">Nama teknisi contoh</label><input id="name" required maxlength="40"><div><button value="cancel" formnovalidate>Batal</button><button value="add">Tambah</button></div></form></dialog><script>document.getElementById('form').addEventListener('submit',e=>{if(e.submitter.value!=='add')return;const n=document.getElementById('name');if(!n.value.trim()){e.preventDefault();return}const tag=document.createElement('span');tag.className='chip';tag.append(document.createTextNode(n.value.trim()));const remove=document.createElement('button');remove.type='button';remove.className='remove';remove.textContent='×';remove.setAttribute('aria-label','Hapus '+n.value.trim()+' dari penugasan');remove.onclick=()=>tag.remove();tag.append(remove);const box=document.getElementById('people');box.insertBefore(tag,box.lastElementChild);n.value=''})</script></html>
